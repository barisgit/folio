<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio Tweaks Playground</title>
  <link rel="stylesheet" href="/assets/playground.css">
</head>
<body>
  <main id="folio-playground">
    <section class="workspace" aria-label="Rendered document workspace">
      <header class="toolbar" aria-label="Document controls">
        <div class="title-block">
          <p class="eyebrow">Folio dev</p>
          <h1>Playground</h1>
        </div>
        <div class="toolbar-group" aria-label="Page navigation">
          <button id="prev-page" type="button" aria-label="Previous page">Previous</button>
          <label for="page-selector">Page</label>
          <select id="page-selector" aria-label="Select page"></select>
          <button id="next-page" type="button" aria-label="Next page">Next</button>
        </div>
        <fieldset class="zoom-controls" aria-label="Zoom controls">
          <legend>Zoom</legend>
          <button type="button" data-zoom-mode="fit-width" aria-pressed="true">Fit width</button>
          <button type="button" data-zoom-mode="fit-page" aria-pressed="false">Fit page</button>
          <button type="button" data-zoom-mode="actual-size" aria-pressed="false">100%</button>
        </fieldset>
      </header>
      <div id="preview-container" class="page-canvas" tabindex="0" aria-live="polite" aria-label="Scrollable document pages">
        <div id="preview-frame" class="page-stack"></div>
      </div>
    </section>
    <aside class="panel" aria-label="Tweak controls">
      <div class="panel-heading">
        <p class="eyebrow">Approved values</p>
        <h2>Tweaks</h2>
      </div>
      <p id="status" role="status" aria-live="polite">Loading tweak state…</p>
      <ul id="diagnostics" aria-live="polite" aria-label="Playground diagnostics"></ul>
      <section id="tweak-panel" aria-label="Tweaks"></section>
    </aside>
  </main>
  <script type="module" src="/assets/playground.js"></script>
</body>
</html>
