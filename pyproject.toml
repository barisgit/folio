[build-system]
# pydantic is needed at build time so the hatch hook can import the
# Pydantic-backed playground models and regenerate api.generated.ts
# before the bun bundling step.
requires = ["hatchling>=1.25.0", "pydantic>=2.0,<3"]
build-backend = "hatchling.build"

[project]
name = "folio-dsl"
version = "0.2.0"
description = "Python DSL SVG page builder and reconciliation CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Blaž Aristovnik", email = "blaz@paxia.co" }]
maintainers = [{ name = "Blaž Aristovnik", email = "blaz@paxia.co" }]
keywords = ["dsl", "svg", "layout", "documents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Printing",
]
dependencies = [
  "jinja2>=3.1.0",
  "pillow>=10.0.0",
  "pydantic>=2.0,<3",
  "rich>=14.0.0",
  "typer>=0.12,<1",
]

[project.scripts]
folio = "folio.cli:app"

[project.urls]
Homepage = "https://github.com/barisgit/folio"
Repository = "https://github.com/barisgit/folio"
"Bug Tracker" = "https://github.com/barisgit/folio/issues"

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
  "matplotlib>=3.8",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "twine>=5.0.0",
]

[tool.hatch.build.targets.sdist]
# ``src/folio/_dev`` ships in the sdist because it is a build input: the
# wheel build hook imports it to regenerate ``api.generated.ts`` before
# bundling. The wheel target below still excludes it so end users never
# install dev-only modules.
include = [
  "src/folio/**/*",
  "src/folio/**/.*",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "hatch_build.py",
  "package.json",
  "bun.lock",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.mypy_cache",
  "**/.ty_cache",
  "node_modules",
  "node_modules/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.mypy_cache",
  "**/.ty_cache",
  "node_modules",
  "node_modules/**",
  "src/folio/_dev",
  "src/folio/_dev/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Starter template files are scaffold data, not folio source. They are
# linted in the context of the scaffolded project (where `folio` is a
# third-party import), not this repo — the two contexts demand opposite
# isort classifications, so exclude them here.
extend-exclude = ["src/folio/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH"]
ignore = ["B008"]

[tool.ty.src]
exclude = [
  "src/folio/templates/**",
  "src/folio/vendor/**",
]
