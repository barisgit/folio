[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.1.0"
description = "Python DSL SVG page builder and reconciliation CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Blaž Aristovnik" }]
dependencies = [
  "jinja2>=3.1.0",
  "pillow>=10.0.0",
  "rich>=14.0.0",
  "typer>=0.12,<1",
]

[project.scripts]
folio = "folio.cli:app"

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
  "matplotlib>=3.8",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/folio/**/*",
  "src/folio/**/.*",
  "README.md",
  "pyproject.toml",
  "hatch_build.py",
  "package.json",
  "bun.lock",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.mypy_cache",
  "**/.ty_cache",
  "node_modules",
  "node_modules/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.mypy_cache",
  "**/.ty_cache",
  "node_modules",
  "node_modules/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Starter template files are scaffold data, not folio source. They are
# linted in the context of the scaffolded project (where `folio` is a
# third-party import), not this repo — the two contexts demand opposite
# isort classifications, so exclude them here.
extend-exclude = ["src/folio/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH"]
ignore = ["B008"]

[tool.ty.src]
exclude = [
  "src/folio/templates/**",
  "src/folio/vendor/**",
]
