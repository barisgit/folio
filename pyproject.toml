[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.1.0"
description = "Python DSL SVG page builder and reconciliation CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Blaž Aristovnik" }]
dependencies = [
  "jinja2>=3.1.0",
  "rich>=14.0.0",
  "typer>=0.12,<1",
]

[tool.hatch.build]
include = [
  "src/folio/templates/**/*",
  "src/folio/templates/**/.*",
]

[project.scripts]
folio = "folio.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH"]
ignore = ["B008"]
