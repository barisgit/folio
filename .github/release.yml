changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - semver-major
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI and release
      labels:
        - ci
        - release
        - github-actions
    - title: Maintenance
      labels:
        - chore
        - maintenance
        - dependencies
    - title: Other changes
      labels:
        - "*"
